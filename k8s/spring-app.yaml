apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-config
  namespace: shop
data:
  SPRING_PROFILES_ACTIVE: "gke"
  DB_NAME: "shop"
  DB_HOST: "127.0.0.1"
  DB_PORT: "5432"
  REDIS_HOST: "redis-memorystore.default.svc.cluster.local"
  REDIS_PORT: "6379"
  FASTAPI_URL: "http://fastapi-ai-svc:8000"
  SERVER_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
        role: backend
    spec:
      containers:
      - name: spring-app
        image: gcr.io/PROJECT_ID/spring-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: spring-config
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: cloud-sql-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloud-sql-credentials
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30

      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14
        args:
        - "--structured-logs"
        - "--port=5432"
        - "PROJECT_ID:REGION:INSTANCE_NAME"
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: spring-app-svc
  namespace: shop
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: spring-app
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
