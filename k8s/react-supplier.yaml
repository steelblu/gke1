---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-supplier
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-supplier
  template:
    metadata:
      labels:
        app: react-supplier
    spec:
      containers:
      - name: nginx
        image: gcr.io/PROJECT_ID/react-supplier:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: react-supplier-svc
  namespace: shop
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: react-supplier
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
